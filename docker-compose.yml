services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: banting_raket_db }
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    ports: ["80:8080"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/banting_raket_db?sslmode=disable
      ADMIN_PASSWORD: change-me
    restart: unless-stopped
volumes: { pgdata: {} }
